<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .setup-screen { max-width:560px; margin:60px auto; background:var(--surface,#fff); border:1px solid #E1E6E9; border-radius:10px; padding:28px 30px; font-family:'IBM Plex Sans',sans-serif; }
  .setup-screen h2 { margin-top:0; font-size:18px; }
  .setup-screen ol { padding-left:20px; line-height:1.8; font-size:13.5px; }
  .setup-screen code { background:#F5F7F8; padding:2px 6px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .setup-screen .warn-box { background:#F6E9DE; border:1px solid #E4CBAE; border-radius:6px; padding:10px 12px; font-size:12.5px; margin-top:16px; }
  :root{
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --ink:#16212B;
    --ink-soft:#5B6770;
    --ink-faint:#8A959C;
    --accent:#2F6F5E;
    --accent-dark:#1F4E42;
    --accent-soft:#E4EFEC;
    --warn:#B8703A;
    --warn-soft:#F6E9DE;
    --danger:#B3261E;
    --danger-soft:#F7E4E2;
    --border:#E1E6E9;
    --border-strong:#C7CFD3;
  }
  * { box-sizing: border-box; }
  html,body{ height:100%; }
  body {
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  .mono { font-family:'IBM Plex Mono', monospace; }
  button { font-family:inherit; cursor:pointer; }
  input, select, textarea { font-family:inherit; font-size:14px; }

  #app { max-width:1320px; margin:0 auto; padding:28px 24px 80px; }

  .header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .brand-row { display:flex; align-items:center; gap:12px; }
  .brand-logo { height:40px; width:auto; display:block; }
  .header h1 { font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:-0.01em; }
  .header p { margin:0; color:var(--ink-soft); font-size:13px; }
  .sync-row { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-faint); }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; }
  .btn-refresh { border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-soft); padding:6px 10px; border-radius:6px; font-size:12px; }
  .btn-refresh:hover { border-color:var(--accent); color:var(--accent-dark); }
  .lang-switch { display:flex; gap:2px; background:var(--border); padding:2px; border-radius:6px; }
  .lang-switch button { border:none; background:transparent; padding:4px 9px; font-size:11px; font-weight:500; border-radius:4px; color:var(--ink-soft); }
  .lang-switch button.active { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.06); }

  .stats { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 16px; min-width:140px; }
  .stat .n { font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; line-height:1.1; }
  .stat .l { font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .stat.warn .n { color:var(--warn); }
  .stat.danger .n { color:var(--danger); }

  .layout { display:grid; grid-template-columns: 1.4fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } }

  .panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .panel-head { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap; }
  .panel-head h2 { font-size:15px; font-weight:600; margin:0; }
  .panel-head .sub { font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .btn-primary { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; font-size:13px; font-weight:500; }
  .btn-primary:hover { background:var(--accent-dark); }
  .btn-ghost { background:none; border:1px solid var(--border-strong); color:var(--ink-soft); padding:7px 12px; border-radius:6px; font-size:13px; }
  .btn-ghost:hover { border-color:var(--ink-soft); color:var(--ink); }
  .btn-text { background:none; border:none; color:var(--ink-faint); font-size:12px; padding:2px 4px; }
  .btn-text:hover { color:var(--danger); }
  .btn-text.link { color:var(--accent); }
  .btn-text.link:hover { color:var(--accent-dark); }

  .search-row { padding:12px 18px; border-bottom:1px solid var(--border); }
  .search-row input { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); }
  .search-row input:focus { outline:none; border-color:var(--accent); }

  .group-label { padding:12px 18px 7px; font-size:14px; font-weight:700; color:var(--accent-dark); border-bottom:1px solid var(--border); background:#FAFBFC; letter-spacing:-0.01em; }

  .batch-row { display:grid; grid-template-columns: 92px 60px 1fr 100px 34px; gap:10px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--border); border-left:3px solid transparent; }
  .batch-row:hover { background:#FAFBFC; }
  .batch-row.exp-soon { border-left-color:var(--warn); }
  .batch-row.exp-over { border-left-color:var(--danger); }
  .batch-lote { font-size:13px; font-weight:600; color:var(--ink-soft); }
  .batch-emb { color:var(--ink-soft); font-size:12.5px; }
  .batch-mid .medio { font-weight:500; font-size:13px; }
  .batch-mid .venc { font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .batch-mid .venc.warn { color:var(--warn); }
  .batch-mid .venc.danger { color:var(--danger); }
  .batch-qty { text-align:right; }
  .batch-qty .num { font-size:14px; font-weight:600; }
  .batch-qty .of { font-size:11px; color:var(--ink-faint); }
  .bar-track { height:4px; background:var(--border); border-radius:2px; margin-top:4px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--accent); }
  .batch-row.exp-soon .bar-fill { background:var(--warn); }
  .batch-row.exp-over .bar-fill { background:var(--danger); }
  .row-menu-btn { color:var(--ink-faint); border:none; background:none; font-size:16px; line-height:1; padding:4px; }
  .row-menu-btn:hover { color:var(--ink); }

  .empty { padding:36px 18px; text-align:center; color:var(--ink-faint); font-size:13px; }

  .order-card { border-bottom:1px solid var(--border); padding:14px 18px; }
  .order-card:hover { background:#FAFBFC; }
  .order-top { display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; }
  .order-top .cliente { font-weight:600; font-size:13.5px; }
  .order-top .meta { font-size:11.5px; color:var(--ink-faint); }
  .order-items { margin-top:8px; padding-left:2px; }
  .order-item-line { display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); padding:2px 0; }
  .order-item-line .qty { font-weight:600; color:var(--ink); }
  .order-actions { margin-top:8px; display:flex; gap:12px; }

  .toggle-depleted { padding:10px 18px; border-top:1px solid var(--border); text-align:center; }

  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(22,33,43,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; }
  .modal { background:var(--surface); border-radius:10px; width:100%; max-width:520px; padding:22px 24px 24px; }
  .modal h3 { margin:0 0 4px; font-size:16px; font-weight:600; }
  .modal .modal-sub { font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select { width:100%; padding:8px 10px; border:1px solid var(--border-strong); border-radius:6px; background:var(--bg); }
  .field input:focus, .field select:focus { outline:none; border-color:var(--accent); }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .error-msg { color:var(--danger); font-size:12.5px; margin-top:10px; }

  .item-line { display:grid; grid-template-columns: 1fr 90px 28px; gap:8px; align-items:center; margin-bottom:8px; }
  .item-line select, .item-line input { padding:7px 9px; border:1px solid var(--border-strong); border-radius:6px; background:var(--bg); font-size:13px; }
  .item-remove { background:none; border:none; color:var(--ink-faint); font-size:18px; }
  .item-remove:hover { color:var(--danger); }
  .add-item-btn { font-size:12.5px; color:var(--accent); background:none; border:1px dashed var(--border-strong); border-radius:6px; padding:7px 10px; width:100%; text-align:center; margin-top:2px; }
  .add-item-btn:hover { border-color:var(--accent); }
  .remaining-hint { font-size:11px; color:var(--ink-faint); margin-top:3px; }

  .footer-note { margin-top:22px; font-size:11.5px; color:var(--ink-faint); text-align:center; line-height:1.6; }
  /* ---- Documentos adjuntos por envío ---- */
  .doc-pills { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .doc-pill { font-size:10.5px; line-height:1; padding:3px 8px; border-radius:10px; border:1px solid var(--border-strong); color:var(--ink-faint); background:transparent; }
  .doc-pill.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); font-weight:500; }
  .doc-links { margin-top:10px; padding-top:8px; border-top:1px dashed var(--border); display:flex; flex-direction:column; gap:2px; }
  .doc-link { display:flex; align-items:center; gap:8px; font-size:12.5px; padding:2px 0; }
  .doc-link .kind { flex:0 0 auto; min-width:78px; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.03em; }
  .doc-link .btn-text { text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 auto; }
  .doc-link .sz, .attach-file .sz { flex:0 0 auto; color:var(--ink-faint); font-size:11px; white-space:nowrap; }
  .doc-none { font-size:12px; color:var(--ink-faint); }
  .attach-group { border:1px solid var(--border); border-radius:8px; padding:9px 11px; margin-bottom:8px; background:var(--bg); }
  .attach-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .attach-title { font-size:12.5px; font-weight:600; color:var(--ink); }
  .attach-add { font-size:12px; color:var(--accent); background:var(--surface); border:1px dashed var(--border-strong); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  .attach-add:hover { border-color:var(--accent); }
  .attach-files { margin-top:8px; display:flex; flex-direction:column; gap:5px; }
  .attach-file { display:flex; align-items:center; gap:8px; font-size:12.5px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:3px 4px 3px 9px; }
  .attach-file .nm { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; padding:0; }
  .attach-file .item-remove { padding:0 6px; line-height:1.2; }
  /* móvil: que el campo de cantidad no se salga del recuadro */
  .item-line { grid-template-columns:minmax(0,1fr) 90px 28px; }
  .item-line select { min-width:0; text-overflow:ellipsis; }
</style>

function t(key, vars){
  let s = (I18N[lang] && I18N[lang][key]) || I18N.es[key] || key;
  if(vars) Object.keys(vars).forEach(k => { s = s.replace('{'+k+'}', vars[k]); });
  return s;
}

function setLang(l){
  lang = l;
  try { localStorage.setItem('vitrogen_lang', l); } catch(e){}
  document.documentElement.lang = l;
  render();
}

let state = {
  batches: [],
  orders: [],
  loading: true,
  error: null,
  search: '',
  showDepleted: false,
  expandedOrders: {},
  modal: null, // {type:'batch'|'order', data:{...}}
  lastSync: null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return `${String(d.getDate()).padStart(2,'0')} ${MESES_BY_LANG[lang][d.getMonth()]} ${d.getFullYear()}`;
}

function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function remainingFor(batchId, draftExcludeIdx, draftItems, excludeOrderId){
  const batch = state.batches.find(b => b.id === batchId);
  if(!batch) return 0;
  let used = 0;
  state.orders.forEach(o => {
    if(excludeOrderId && o.id === excludeOrderId) return;
    o.items.forEach(it => { if(it.batchId === batchId) used += Number(it.cantidad); });
  });
  if(draftItems){
    draftItems.forEach((it, idx) => {
      if(idx === draftExcludeIdx) return;
      if(it.batchId === batchId) used += Number(it.cantidad || 0);
    });
  }
  return batch.cantidad_inicial - used;
}

async function loadData(){
  state.loading = true; render();
  try {
    const [{ data: b, error: eb }, { data: o, error: eo }] = await Promise.all([
      db.from('batches').select('*').order('created_at', { ascending: true }),
      db.from('orders').select('*').order('created_at', { ascending: false })
    ]);
    if(eb || eo) throw (eb || eo);
    state.batches = b || [];
    state.orders = o || [];
    state.error = null;
    state.lastSync = new Date();
  } catch(e){
    state.error = t('loadErrMsg');
  }
  state.loading = false;
  render();
}

function silentRefresh(){
  if(state.modal) return; // don't clobber someone mid-edit
  loadDataQuiet();
}
async function loadDataQuiet(){
  try {
    const [{ data: b, error: eb }, { data: o, error: eo }] = await Promise.all([
      db.from('batches').select('*').order('created_at', { ascending: true }),
      db.from('orders').select('*').order('created_at', { ascending: false })
    ]);
    if(eb || eo) return;
    state.batches = b || [];
    state.orders = o || [];
    state.lastSync = new Date();
    render();
  } catch(e){ /* ignore transient errors on background refresh */ }
}
setInterval(silentRefresh, 20000);

function setupRealtime(){
  db.channel('inventory-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batches' }, () => silentRefresh())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => silentRefresh())
    .subscribe();
}

function openAddBatch(){

function openEditBatch(id){
  const b = state.batches.find(x=>x.id===id);
  if(!b) return;
  state.modal = { type:'batch', data: JSON.parse(JSON.stringify(b)), error:'' };
  render();
}
async function submitBatch(){
  const d = state.modal.data;
  if(!d.medio.trim() || !d.embalagem.trim() || !d.lote.trim() || !d.cantidad_inicial || Number(d.cantidad_inicial) <= 0){
    state.modal.error = t('errBatchRequired');
    render(); return;
  }
  const payload = {
    medio: d.medio.trim(), embalagem: d.embalagem.trim(), lote: d.lote.trim(),
    validade: d.validade || null, cantidad_inicial: Number(d.cantidad_inicial),
    fecha_entrada: d.fecha_entrada || null, notas: d.notas || null
  };
  try {
    if(d.id){
      const { error } = await db.from('batches').update(payload).eq('id', d.id);
      if(error) throw error;
      const idx = state.batches.findIndex(x=>x.id===d.id);
      if(idx>-1) state.batches[idx] = { ...state.batches[idx], ...payload };
    } else {
      const { data, error } = await db.from('batches').insert([payload]).select();
      if(error) throw error;
      state.batches.push(data[0]);
    }
    state.modal = null;
  } catch(e){
    state.modal.error = t('errBatchSaveFail');
  }
  render();
}
async function deleteBatch(id){
  const b = state.batches.find(x=>x.id===id);
  const rem = remainingFor(id);
  const used = b.cantidad_inicial - rem;
  const msg = used > 0
    ? t('confirmDeleteBatchUsed', { used })
    : t('confirmDeleteBatchSimple', { lote: b.lote });
  if(!confirm(msg)) return;
  try {
    const { error } = await db.from('batches').delete().eq('id', id);
    if(error) throw error;
    state.batches = state.batches.filter(x=>x.id!==id);
  } catch(e){ alert(t('alertDeleteFail')); }
  render();
}

async function submitOrder(){
  const m = state.modal;
  if(!m || m.saving || m.busy) return;
  const d = m.data;
  if(!d.cliente.trim()){ m.error = t('errOrderClienteRequired'); render(); return; }
  const items = d.items.filter(it => it.batchId && Number(it.cantidad) > 0);
  if(items.length === 0){ m.error = t('errOrderNeedItem'); render(); return; }
  for(let i=0;i<d.items.length;i++){
    const it = d.items[i];
    if(!it.batchId || !it.cantidad) continue;
    const rem = remainingFor(it.batchId, i, d.items, d.id);
    if(Number(it.cantidad) > rem){
      const b = state.batches.find(x=>x.id===it.batchId);
      m.error = t('errOrderInsufficientStock', { medio:b.medio, lote:b.lote, rem });
      render(); return;
    }
  }
  const snapshotItems = items.map(it => {
    const b = state.batches.find(x=>x.id===it.batchId);
    return { batchId: it.batchId, medio:b.medio, embalagem:b.embalagem, lote:b.lote, cantidad:Number(it.cantidad) };
  });
  const keptAtt = (d.attachments || []).filter(a => !a._removed).map(a => { const c = { ...a }; delete c._removed; return c; });
  const removedPaths = (d.attachments || []).filter(a => a._removed).map(a => a.path);
  const uploaded = [];
  m.saving = true; m.error = ''; render();
  try {
    // 1) subir los archivos nuevos al bucket privado
    for(const nf of (d.newFiles || [])){
      const path = `${docFolder()}/${nf.type}_${safeFileName(nf.file.name)}`;
      const { error } = await db.storage.from(DOC_BUCKET).upload(path, nf.file, { contentType: nf.file.type || 'application/octet-stream', upsert:false });
      if(error){ const ue = new Error('upload'); ue.kind = 'upload'; throw ue; }
      uploaded.push({ type:nf.type, name:nf.file.name, path, size:nf.file.size, mime:nf.file.type || '' });
    }
    const attachments = [...keptAtt, ...uploaded];
    // 2) guardar el envío (la columna attachments solo se envía si hace falta)
    const payload = { cliente: d.cliente.trim(), fecha: d.fecha, items: snapshotItems };
    if(d.id){
      const prev = state.orders.find(x=>x.id===d.id);
      if(attachments.length || (prev && 'attachments' in prev)) payload.attachments = attachments;
      const { error } = await db.from('orders').update(payload).eq('id', d.id);
      if(error) throw error;
      const idx = state.orders.findIndex(x=>x.id===d.id);
      if(idx>-1) state.orders[idx] = { ...state.orders[idx], ...payload };
    } else {
      if(attachments.length) payload.attachments = attachments;
      const { data, error } = await db.from('orders').insert([payload]).select();
      if(error) throw error;
      state.orders.unshift(data[0]);
    }
    // 3) borrar del bucket los archivos que el usuario quitó
    if(removedPaths.length){ try { await db.storage.from(DOC_BUCKET).remove(removedPaths); } catch(e2){} }
    state.modal = null;
  } catch(e){
    // si algo falló, no dejar archivos huérfanos en el bucket
    if(uploaded.length){ try { await db.storage.from(DOC_BUCKET).remove(uploaded.map(u => u.path)); } catch(e2){} }
    if(state.modal === m){
      m.saving = false;
      if(e && e.kind === 'upload') m.error = t('errUploadFail');
      else if(String((e && e.message) || '').includes('attachments')) m.error = t('errNeedSql');
      else m.error = t('errOrderSaveFail');
    }
  }
  render();
}
async function voidOrder(id){
  const o = state.orders.find(x=>x.id===id);
  const atts = (o && o.attachments) || [];
  if(!confirm(atts.length ? t('confirmVoidOrderFiles', { n: atts.length }) : t('confirmVoidOrder'))) return;
  try {
    const { error } = await db.from('orders').delete().eq('id', id);
    if(error) throw error;
    state.orders = state.orders.filter(o=>o.id!==id);
    if(atts.length){ try { await db.storage.from(DOC_BUCKET).remove(atts.map(a => a.path)); } catch(e2){} }
  } catch(e){ alert(t('alertVoidFail')); }
  render();
}

const DOC_BUCKET = 'shipment-docs';
const DOC_TYPES = ['invoice','label','receipt'];
const DOC_MAX_BYTES = 15 * 1024 * 1024;
const DOC_ACCEPT = 'application/pdf,image/*';
const DOC_OK_MIME = ['application/pdf','image/jpeg','image/png','image/webp','image/heic','image/heif'];

function docFolder(){
  try { if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return uid() + uid();
}
function safeFileName(name){
  const s = String(name || 'file').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_');
  return s.slice(-80) || 'file';
}
function fmtSize(n){
  n = Number(n) || 0;
  if(n >= 1048576) return (n/1048576).toFixed(1) + ' MB';
  return Math.max(1, Math.round(n/1024)) + ' KB';
}

// Las fotos grandes del celular se reducen (máx. 1800 px, JPEG) para no llenar el almacenamiento.
async function prepareFile(file){
  if(!(file.type || '').startsWith('image/') || file.size < 600*1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.82));
    if(!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' });
  } catch(e){ return file; }
}

async function onPickFiles(type, input){
  const files = Array.from(input.files || []);
  input.value = '';
  const m = state.modal;
  if(!files.length || !m) return;
  m.error = '';
  m.busy = (m.busy || 0) + 1; render();
  for(let f of files){
    const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    if(isPdf && f.type !== 'application/pdf') f = new File([f], f.name, { type:'application/pdf' });
    if(!isPdf && !(f.type || '').startsWith('image/')){ m.error = t('errFileType'); continue; }
    f = await prepareFile(f);
    if(!DOC_OK_MIME.includes((f.type || '').toLowerCase())){ m.error = t('errFileType'); continue; }
    if(f.size > DOC_MAX_BYTES){ m.error = t('errFileSize', { name: f.name }); continue; }
    m.data.newFiles.push({ type, file: f });
  }
  m.busy = Math.max(0, (m.busy || 1) - 1);
  if(state.modal === m) render();
}
function removeAttachment(i){ const a = state.modal.data.attachments[i]; if(a){ a._removed = true; render(); } }
function removeNewFile(i){ state.modal.data.newFiles.splice(i, 1); render(); }

async function openStoragePath(path){
  // se abre la pestaña de inmediato (por los bloqueadores de ventanas) y luego se le asigna la URL firmada
  const w = window.open('', '_blank');

    const { data, error } = await db.storage.from(DOC_BUCKET).createSignedUrl(path, 3600);

    if(w) w.location.href = data.signedUrl; else window.location.href = data.signedUrl;
  } catch(e){
    if(w) w.close();
    alert(t('alertOpenFail'));
  }
}

// render() vuelve a dibujar todo; estas dos funciones devuelven el cursor al campo que se estaba escribiendo
function focusEnd(el){

  catch(e){ const v = el.value; el.value = ''; el.value = v; }   // type=number no admite setSelectionRange
}

function statusClass(iso){
  const d = daysUntil(iso);
  if(d === null) return '';
  if(d < 0) return 'exp-over';
  if(d <= 30) return 'exp-soon';
  return '';
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div style="padding:60px;text-align:center;color:var(--ink-faint)">${t('loadingText')}</div>`; return; }
  if(state.error){
    app.innerHTML = `<div class="setup-screen"><h2>${t('connectErrTitle')}</h2><p>${escapeHtml(state.error)}</p><button class="btn-primary" onclick="loadData()">${t('retryBtn')}</button></div>`;
    return;
  }

  const activeBatches = state.batches.map(b => ({...b, remaining: remainingFor(b.id)}));
  const visibleBatches = activeBatches.filter(b => state.showDepleted ? true : b.remaining > 0);
  const filtered = visibleBatches.filter(b => {
    const q = state.search.toLowerCase();
    if(!q) return true;
    return b.medio.toLowerCase().includes(q) || b.lote.toLowerCase().includes(q) || b.embalagem.toLowerCase().includes(q);
  });
  const groups = {};
  filtered.forEach(b => { (groups[b.medio] = groups[b.medio] || []).push(b); });
  Object.values(groups).forEach(arr => arr.sort((a,b) => (a.validade||'').localeCompare(b.validade||'')));
  const groupNames = Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  const nActive = activeBatches.filter(b=>b.remaining>0).length;
  const nSoon = activeBatches.filter(b=>b.remaining>0 && daysUntil(b.validade)!==null && daysUntil(b.validade)<=30 && daysUntil(b.validade)>=0).length;
  const nOver = activeBatches.filter(b=>b.remaining>0 && daysUntil(b.validade)!==null && daysUntil(b.validade)<0).length;
  const depletedCount = activeBatches.filter(b=>b.remaining<=0).length;

      <div>
        <h1>${t('headerTitle')}</h1>
        <p>${t('headerSubtitle')}</p>
      </div>
    </div>
    <div class="sync-row">
      <div class="lang-switch">
        <button class="${lang==='es'?'active':''}" onclick="setLang('es')">ES</button>
        <button class="${lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
        <button class="${lang==='pt'?'active':''}" onclick="setLang('pt')">PT</button>
      </div>
      <span class="sync-dot"></span>
      <span>${state.lastSync ? t('synced') + state.lastSync.toLocaleTimeString(lang==='en'?'en-US':(lang==='pt'?'pt-BR':'es-ES'),{hour:'2-digit',minute:'2-digit'}) : ''}</span>
      <button class="btn-refresh" onclick="loadData()">${t('refresh')}</button>
    </div>
  </div>`;

  html += `<div class="stats">
    <div class="stat"><div class="n mono">${nActive}</div><div class="l">${t('statActive')}</div></div>
    <div class="stat warn"><div class="n mono">${nSoon}</div><div class="l">${t('statSoon')}</div></div>
    <div class="stat danger"><div class="n mono">${nOver}</div><div class="l">${t('statOver')}</div></div>
    <div class="stat"><div class="n mono">${state.orders.length}</div><div class="l">${t('statOrders')}</div></div>
  </div>`;

  html += `<div class="layout">`;

  // STOCK PANEL
  html += `<div class="panel">
    <div class="panel-head">
      <div><h2>${t('stockPanelTitle')}</h2><div class="sub">${t('stockPanelSub')}</div></div>
      <button class="btn-primary" onclick="openAddBatch()">${t('addBatchBtn')}</button>
    </div>
    <div class="search-row"><input placeholder="${t('searchPlaceholder')}" value="${escapeAttr(state.search)}" oninput="state.search=this.value; render(); refocusSearch()"></div>`;

  if(groupNames.length === 0){
    html += state.batches.length === 0
      ? `<div class="empty">${t('emptyNoBatches')}</div>`
      : `<div class="empty">${t('emptyNoMatch')}</div>`;
  } else {
    groupNames.forEach(name => {
      html += `<div class="group-label">${escapeHtml(name)}</div>`;
      groups[name].forEach(b => {
        const cls = statusClass(b.validade);
        const d = daysUntil(b.validade);
        const vencClass = cls === 'exp-over' ? 'danger' : (cls === 'exp-soon' ? 'warn' : '');
        const pct = b.cantidad_inicial ? Math.max(0, Math.min(100, Math.round((b.remaining / b.cantidad_inicial) * 100))) : 0;
        const vencText = d===null ? t('noExpiry') : (d < 0 ? t('expiredAgo', {d: Math.abs(d)}) : t('expiresIn', {d}));
        html += `<div class="batch-row ${cls}">
          <div class="batch-lote mono">${escapeHtml(b.lote)}</div>
          <div class="batch-emb">${escapeHtml(b.embalagem)}</div>
          <div class="batch-mid">
            <div class="venc ${vencClass}">${fmtDate(b.validade)} · ${vencText}</div>
          </div>
          <div class="batch-qty">
            <div class="num mono">${b.remaining}<span class="of"> / ${b.cantidad_inicial}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div style="position:relative">
            <button class="row-menu-btn" onclick="toggleRowMenu('${b.id}', event)">⋯</button>
            <div id="menu-${b.id}" style="display:none;position:absolute;right:0;top:24px;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,0.08);z-index:5;min-width:110px;">
              <button class="btn-text link" style="display:block;width:100%;text-align:left;padding:8px 12px;" onclick="closeRowMenus(); openEditBatch('${b.id}')">${t('editBtn')}</button>
              <button class="btn-text" style="display:block;width:100%;text-align:left;padding:8px 12px;" onclick="closeRowMenus(); deleteBatch('${b.id}')">${t('deleteBtn')}</button>
            </div>
          </div>
        </div>`;
      });
    });
  }
  if(depletedCount > 0){
    html += `<div class="toggle-depleted"><button class="btn-text link" onclick="state.showDepleted=!state.showDepleted; render()">${t(state.showDepleted ? 'hideDepleted' : 'showDepleted', {n: depletedCount})}</button></div>`;
  }
  html += `</div>`;

  // ORDERS PANEL
  html += `<div class="panel">
    <div class="panel-head">
      <div><h2>${t('ordersPanelTitle')}</h2><div class="sub">${t('ordersPanelSub')}</div></div>
      <button class="btn-primary" onclick="openNewOrder()">${t('newOrderBtn')}</button>
    </div>`;
  if(state.orders.length === 0){
    html += `<div class="empty">${t('emptyNoOrders')}</div>`;
  } else {
    state.orders.forEach(o => {
      const expanded = !!state.expandedOrders[o.id];
      const totalItems = o.items.reduce((s,it)=>s+it.cantidad,0);
      html += `<div class="order-card">
        <div class="order-top" onclick="state.expandedOrders['${o.id}']=!state.expandedOrders['${o.id}']; render()">
          <div>
            <div class="cliente">${escapeHtml(o.cliente)}</div>
            <div class="meta">${fmtDate(o.fecha)} · ${t('orderMeta', {n:o.items.length, u:totalItems})}</div>
            ${docPillsHtml(o)}
          </div>
          <div class="meta">${expanded ? '▲' : '▼'}</div>
        </div>`;
      if(expanded){
        html += `<div class="order-items">`;
        o.items.forEach(it => {
          html += `<div class="order-item-line"><span>${escapeHtml(it.medio)} · ${escapeHtml(it.embalagem)} · <span class="mono">${escapeHtml(it.lote)}</span></span><span class="qty mono">${it.cantidad}</span></div>`;
        });
        html += `</div>
        ${docLinksHtml(o)}
        <div class="order-actions"><button class="btn-text link" onclick="openEditOrder('${o.id}')">${t('editBtn')}</button><button class="btn-text" onclick="voidOrder('${o.id}')">${t('voidOrderBtn')}</button></div>`;
      }
      html += `</div>`;
    });
  }
  html += `</div>`; // end orders panel
  html += `</div>`; // end layout

  html += `<div class="footer-note">${t('footerNote')}</div>`;

  // MODAL
  if(state.modal) html += renderModal();

  app.innerHTML = html;
}

function renderModal(){
  const m = state.modal;
  if(m.type === 'batch'){
    const d = m.data;
    const isEdit = !!d.id;
    return `<div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${isEdit ? t('modalEditBatchTitle') : t('modalAddBatchTitle')}</h3>
        <div class="modal-sub">${isEdit ? t('modalEditBatchSub') : t('modalAddBatchSub')}</div>
        <div class="field-row">
          <div class="field"><label>${t('labelMedio')}</label><input list="medios-list" value="${escapeAttr(d.medio)}" oninput="state.modal.data.medio=this.value"></div>
          <div class="field"><label>${t('labelEmbalaje')}</label><input list="emb-list" value="${escapeAttr(d.embalagem)}" oninput="state.modal.data.embalagem=this.value"></div>
        </div>
        <datalist id="medios-list">${[...new Set(state.batches.map(b=>b.medio))].map(v=>`<option value="${escapeAttr(v)}">`).join('')}</datalist>
        <datalist id="emb-list">${[...new Set(state.batches.map(b=>b.embalagem))].map(v=>`<option value="${escapeAttr(v)}">`).join('')}</datalist>
        <div class="field-row">
          <div class="field"><label>${t('labelLote')}</label><input value="${escapeAttr(d.lote)}" oninput="state.modal.data.lote=this.value"></div>
          <div class="field"><label>${t('labelCantidad')}</label><input type="number" min="1" value="${escapeAttr(d.cantidad_inicial)}" oninput="state.modal.data.cantidad_inicial=this.value"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>${t('labelVencimiento')}</label><input type="date" value="${escapeAttr(d.validade)}" oninput="state.modal.data.validade=this.value"></div>
          <div class="field"><label>${t('labelFechaEntrada')}</label><input type="date" value="${escapeAttr(d.fecha_entrada)}" oninput="state.modal.data.fecha_entrada=this.value"></div>
        </div>
        ${m.error ? `<div class="error-msg">${escapeHtml(m.error)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">${t('cancelBtn')}</button>
          <button class="btn-primary" onclick="submitBatch()">${isEdit ? t('saveChangesBtn') : t('addBatchBtn').replace('+ ','')}</button>
        </div>
      </div>
    </div>`;
  } else {
    const d = m.data;
    const isEdit = !!d.id;
    const availableBatches = state.batches.filter(b => remainingFor(b.id, null, null, d.id) > 0 || d.items.some(it=>it.batchId===b.id));
    let itemsHtml = '';
    d.items.forEach((it, idx) => {
      const rem = it.batchId ? remainingFor(it.batchId, idx, d.items, d.id) : null;
      itemsHtml += `<div class="item-line">
        <select onchange="state.modal.data.items[${idx}].batchId=this.value; render()">
          <option value="">${t('selectPlaceholder')}</option>
          ${availableBatches.map(b => `<option value="${b.id}" ${it.batchId===b.id?'selected':''}>${escapeHtml(b.medio)} · ${escapeHtml(b.embalagem)} · ${escapeHtml(b.lote)} (${t('remainingSuffix',{n:remainingFor(b.id, idx, d.items, d.id)})})</option>`).join('')}
        </select>
        <input type="number" min="1" placeholder="${t('placeholderCant')}" value="${escapeAttr(it.cantidad)}" oninput="state.modal.data.items[${idx}].cantidad=this.value; render(); refocusQty(${idx})">
        <button class="item-remove" onclick="removeOrderItemLine(${idx})">×</button>
      </div>`;
    });
    return `<div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${isEdit ? t('modalEditOrderTitle') : t('modalNewOrderTitle')}</h3>
        <div class="modal-sub">${isEdit ? t('modalEditOrderSub') : t('modalNewOrderSub')}</div>
        <div class="field-row">
          <div class="field"><label>${t('labelCliente')}</label><input value="${escapeAttr(d.cliente)}" oninput="state.modal.data.cliente=this.value"></div>
          <div class="field"><label>${t('labelFecha')}</label><input type="date" value="${escapeAttr(d.fecha)}" oninput="state.modal.data.fecha=this.value"></div>
        </div>
        <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;">${t('labelMediosEnviados')}</label>
        ${itemsHtml}
        <button class="add-item-btn" onclick="addOrderItemLine()">${t('addAnotherBtn')}</button>
        ${renderAttachBlock()}
        ${m.error ? `<div class="error-msg">${escapeHtml(m.error)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">${t('cancelBtn')}</button>
          <button class="btn-primary" ${(m.saving || m.busy) ? 'disabled style="opacity:.6;cursor:wait"' : ''} onclick="submitOrder()">${m.saving ? t('savingBtn') : (m.busy ? t('processingBtn') : (isEdit ? t('saveChangesBtn') : t('registerOrderBtn')))}</button>
        </div>
      </div>
    </div>`;
  }
}

function toggleRowMenu(id, ev){
  ev.stopPropagation();
  closeRowMenus();
  const el = document.getElementById('menu-'+id);
  if(el) el.style.display = 'block';
  document.addEventListener('click', closeRowMenus, { once:true });
}
function closeRowMenus(){
  document.querySelectorAll('[id^="menu-"]').forEach(el => el.style.display='none');
}

function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function renderSetupScreen(){
  document.getElementById('app').innerHTML = `
    <div class="setup-screen">
      <h2>Falta conectar la base de datos</h2>
      <p>Este archivo necesita tus datos de Supabase para guardar el inventario. Es un paso único:</p>
      <ol>
        <li>Crea un proyecto gratis en <code>supabase.com</code>.</li>
        <li>En el editor SQL, ejecuta el script <code>schema.sql</code> que viene junto a este archivo.</li>
        <li>Ve a <em>Project Settings → API</em> y copia el <code>Project URL</code> y el <code>anon public key</code>.</li>
        <li>Abre <code>index.html</code> en un editor de texto y reemplaza <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> al principio del <code>&lt;script&gt;</code>.</li>
        <li>Guarda y vuelve a subir el archivo a GitHub.</li>
      </ol>
      <div class="warn-box">La clave <code>anon key</code> está pensada para usarse en el navegador — no es secreta como una contraseña de base de datos. Aun así, con las políticas del script SQL, cualquiera con el enlace del sitio podrá leer y editar los datos, igual que si fuera un Google Sheet compartido por enlace.</div>
    </div>`;
}

document.documentElement.lang = lang;
if(!isConfigured || !window.supabase){
  renderSetupScreen();
} else {
  setupRealtime();
  loadData();
}
</script>
